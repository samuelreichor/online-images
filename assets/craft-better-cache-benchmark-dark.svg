<svg xmlns="http://www.w3.org/2000/svg" width="820" height="356" viewBox="0 0 820 356" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <text x="0" y="34" font-size="20" font-weight="700" fill="#E6EDF3">Better Cache vs. Blitz with 10,000 cached pages</text>
  <text x="0" y="58" font-size="14" fill="#9AA7B4">Seconds, shorter is better</text>
  <text x="0" y="122" font-size="16" font-weight="700" fill="#E6EDF3">Saving an article <tspan font-weight="400" fill="#9AA7B4">until every affected page is rendered again</tspan></text>
  <text x="0" y="156.0" font-size="14" fill="#E6EDF3" font-weight="600">Better Cache</text>
  <rect x="130" y="136" width="273.6" height="30" rx="6" fill="#50A5DC"/>
  <text x="413.6" y="156.0" font-size="14" fill="#E6EDF3" font-weight="700">511 s<tspan fill="#50A5DC">  2.0× faster</tspan></text>
  <text x="0" y="194.0" font-size="14" fill="#E6EDF3" font-weight="400">Blitz 5.14</text>
  <rect x="130" y="174" width="560.0" height="30" rx="6" fill="#4A5562"/>
  <text x="700.0" y="194.0" font-size="14" fill="#E6EDF3" font-weight="400">1,046 s<tspan fill="#50A5DC"></tspan></text>
  <text x="0" y="252" font-size="16" font-weight="700" fill="#E6EDF3">Warming the cache <tspan font-weight="400" fill="#9AA7B4">rendering and storing all pages</tspan></text>
  <text x="0" y="286.0" font-size="14" fill="#E6EDF3" font-weight="600">Better Cache</text>
  <rect x="130" y="266" width="319.0" height="30" rx="6" fill="#50A5DC"/>
  <text x="459.0" y="286.0" font-size="14" fill="#E6EDF3" font-weight="700">2,363 s<tspan fill="#50A5DC">  1.8× faster</tspan></text>
  <text x="0" y="324.0" font-size="14" fill="#E6EDF3" font-weight="400">Blitz 5.14</text>
  <rect x="130" y="304" width="560.0" height="30" rx="6" fill="#4A5562"/>
  <text x="700.0" y="324.0" font-size="14" fill="#E6EDF3" font-weight="400">4,148 s<tspan fill="#50A5DC"></tspan></text>
</svg>
